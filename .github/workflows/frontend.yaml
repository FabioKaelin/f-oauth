name: Frontend


on:
  # schedule:
    # - cron: '25 19 * * *'
  push:
    branches:
    - "main"
    paths:
    - "frontend/**"
    - ".github/workflows/frontend.yaml"
    # Publish semver tags as releases.
    # tags: [ 'v*.*.*' ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "oauth-frontend"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    #runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6



      - name: Component version
        id: component
        run: echo "version=$(jq -r .frontend_version project-meta.jsonc)" >> "$GITHUB_OUTPUT"
      - name: Frontend release version
        env:
          COMPONENT_VERSION: ${{ steps.component.outputs.version }}
        run: echo "VITE_F_VERSION=$COMPONENT_VERSION" > frontend/.env
      - name: Build and push
        uses: ./.github/actions/docker-build
        with:
          version: ${{ steps.component.outputs.version }}
          imageName: ${{ env.IMAGE_NAME }}
          codePath: frontend
          dockerPAT: ${{ secrets.CR_PAT }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6


      - name: Setup Kubernetes access
        uses: ./.github/actions/setup-kube
        with:
          kube_pwd: ${{ secrets.KUBE_PWD }}

      - name: deploy
        run: |
          export version=$(cat project-meta.jsonc | jq -r ."frontend_version")

          cd frontend
          kubectl create ns oauth || true
          kubectl config set-context --current --namespace oauth
          sed -i "s/latest/${version}/g" resources/deployment.yaml
          kubectl apply -f resources/deployment.yaml
          kubectl rollout restart deployment oauth-frontend
          kubectl rollout status deployment/oauth-frontend --timeout=300s
          kubectl get pods

