name: Build and push application
description: Shared multi-architecture build with per-image cache and immutable revision tag
inputs:
  version:
    description: Component semantic version or development tag
    required: true
  imageName:
    description: GHCR image name
    required: true
  codePath:
    description: Build context
    required: true
  dockerfile:
    description: Dockerfile path
    required: false
    default: ''
  dockerPAT:
    description: Registry credential
    required: true
outputs:
  digest:
    description: Published immutable digest
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.dockerPAT }}
    - id: identity
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        IMAGE: ${{ inputs.imageName }}
      run: echo "image=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.codePath }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/arm64,linux/amd64
        push: true
        build-args: VERSION=${{ inputs.version }}
        tags: |
          ${{ steps.identity.outputs.image }}:${{ inputs.version }}
          ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
        labels: |
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=${{ inputs.imageName }}-${{ github.ref_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.imageName }}-${{ github.ref_name }}
